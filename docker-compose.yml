services:
  app:
    build: .
    shm_size: '2gb'
    volumes:
      - ./data:/app/data
    environment:
      PYTHONUNBUFFERED: "1"
      DB_DRIVER: postgresql+psycopg
      DB_USER: postgres
      DB_PASSWORD: password12345
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: document_retrieval
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password12345
      POSTGRES_DB: document_retrieval
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d document_retrieval"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
