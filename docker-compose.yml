services:
  app:
    build: .
    shm_size: '2gb'
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  db:
    image: pgvector/pgvector:pg17
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d document_retrieval"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  app-test:
    build: .
    shm_size: '2gb'
    profiles:
      - test
    command: uv run python -m document_retrieval.test
    volumes:
      - ./test:/app/test
      - ./src:/app/src
    env_file:
      - .env
    environment:
      - HF_HOME=/app/test/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
