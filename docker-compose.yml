services:
  app:
    build: .
    shm_size: '2gb'
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./migrations:/app/migrations
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  db:
    image: pgvector/pgvector:pg17
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d document_retrieval"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  annotator-backend:
    build: .
    working_dir: /app
    command: uv run uvicorn annotator.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./annotator:/app/annotator
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  annotator-frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./annotator/frontend:/app
    environment:
      - API_URL=http://annotator-backend:8001
    ports:
      - "5173:5173"
    depends_on:
      - annotator-backend

  app-test:
    build: .
    shm_size: '2gb'
    profiles:
      - test
    working_dir: /app
    command: uv run pytest -s
    volumes:
      - ./test:/app/test
      - ./tests:/app/tests
      - ./migrations:/app/migrations
      - ./src:/app/src
    env_file:
      - .env
    environment:
      - POSTGRES_DATABASE=test
      - DB_DATABASE=test
      - HF_HOME=/app/test/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
