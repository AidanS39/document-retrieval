[project]
name = "document-retrieval"
version = "0.1.0"
description = "Implementation of a document retrieval system using multiple embedding and ranking processes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.5",
  "bm25s>=0.3.9",
  "colpali-engine>=0.3.17",
  "datasets>=5.0.0",
  "fast-plaid>=1.4.0",
  "huggingface-hub>=1.18.0",
  "jupyterlab>=4.6.1",
  "pandas>=3.0.3",
  "peft>=0.19.1",
  "pgvector>=0.4.2",
  "pillow>=12.2.0",
  "psycopg[binary]>=3.3.4",
  "pymupdf>=1.27.2.3",
  "python-docx>=1.2.0",
  "fastapi[standard]>=0.115.0",
  "python-dotenv>=1.2.2",
  "python-pptx>=1.0.2",
  "scikit-learn>=1.9.0",
  "sentence-transformers[image]>=5.3.0",
  "sqlalchemy>=2.0.50",
  "transformers>=5.3.0",
  "qwen-vl-utils>=0.0.14",
  "pymupdf4llm>=1.27.2.3",
  "google-genai>=1.0.0",
  "pydantic-ai>=0.4.0",
  "anthropic<1.0.0",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.11.0",
  "torchvision>=0.26.0",
]
cu126 = [
  "torch>=2.11.0",
  "torchvision>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "uv-script>=0.1.9",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu126" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: marks tests as integration tests requiring a database and ML models (deselect with '-m not integration')",
]

[tool.uvs.scripts]
remote-sync = "bash -c 'set -a; source .env; set +a; rsync -avhP \"$LOCAL_SYNC_PATH\" \"$REMOTE_SYNC_URL\" --filter=\":- .gitignore\"'"
