[project]
name = "document-retrieval"
version = "0.1.0"
description = "Implementation of a document retrieval system using multiple embedding and ranking processes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.9",
    "datasets>=5.0.0",
    "fast-plaid>=1.4.0",
    "huggingface-hub>=1.18.0",
    "pandas>=3.0.3",
    "peft>=0.19.1",
    "pgvector>=0.4.2",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.3.4",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers[image]>=5.3.0",
    "sqlalchemy>=2.0.50",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.3.0",
]
