[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project]
name = "document-retrieval"
version = "0.1.0"
description = "Implementation of a document retrieval system using multiple embedding and ranking processes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.5",
  "bm25s>=0.3.9",
  "colpali-engine>=0.3.17",
  "datasets>=5.0.0",
  "fast-plaid>=1.4.0",
  "huggingface-hub>=1.18.0",
  "jupyterlab>=4.6.1",
  "pandas>=3.0.3",
  "peft>=0.19.1",
  "pgvector>=0.4.2",
  "pillow>=12.2.0",
  "psycopg[binary]>=3.3.4",
  "pymupdf>=1.27.2.3",
  "python-docx>=1.2.0",
  "fastapi[standard]>=0.115.0",
  "python-dotenv>=1.2.2",
  "python-pptx>=1.0.2",
  "scikit-learn>=1.9.0",
  "sentence-transformers[image]>=5.3.0",
  "sqlalchemy>=2.0.50",
  "torch>=2.11.0",
  "torchvision>=0.26.0",
  "transformers>=5.3.0",
  "qwen-vl-utils>=0.0.14",
  "pymupdf4llm>=1.27.2.3",
  "google-genai>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "uv-script>=0.1.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: marks tests as integration tests requiring a database and ML models (deselect with '-m not integration')",
]

[tool.uvs.scripts]
remote-sync = 'rsync -avhP LOCAL_SYNC_PATH_REDACTED REMOTE_SYNC_URL_REDACTED --filter=":- .gitignore"'
